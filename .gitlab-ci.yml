report2:
  stage: report
  script:
    - 'mvn $MAVEN_CLI_OPTS jxr:jxr site jacoco:report checkstyle:checkstyle pmd:pmd taglist:taglist'
    - 'cat target/site/jacoco/index.html'
  image: maven:3.6.3-jdk-11
  only: 
    - staging
    - master
  artifacts:
    paths:
      - target/site
    expire_in: 1 week
  when: delayed
  start_in: 10 minutes
    
report:
  stage: report
  script:
    - 'mvn $MAVEN_CLI_OPTS jxr:jxr site jacoco:report checkstyle:checkstyle pmd:pmd taglist:taglist'
    - 'cat target/site/jacoco/index.html'
  image: maven:3.6.3-jdk-11
  except: 
    - master
    - staging
  artifacts:
    paths:
      - target/site
    expire_in: 1 week
  when: manual
    
###### deploy stage ######
deploy-tst2:
  stage: deploy
  script:
    - 'chmod +x deploy.sh && ./deploy.sh tst2 target/tusp.war'
  only:
    - staging
    
deploy-tst:
  stage: deploy
  script:
    - 'chmod +x deploy.sh && ./deploy.sh tst target/tusp.war'
  only:
    - staging

deploy-dev:
  stage: deploy
  script:
    - 'chmod +x deploy.sh && ./deploy.sh dev target/tusp.war'
  only:
    - master
    
deploy-dev:
  stage: deploy
  script:
    - 'chmod +x deploy.sh && ./deploy.sh dev target/tusp.war'
  only:
    - staging
  when: manual
  
deploy-prod:
  stage: deploy
  script:
    - 'chmod +x deploy.sh && ./deploy.sh prod target/tusp.war'
  only:
    - master
  when: manual
  
  
###### sync stage ######
sync:
  stage: sync
  script:
    - 'cd ~/tusp/'
    - 'git fetch'
    - 'git checkout staging'
    - 'git pull'
    - 'git merge origin/master'
    - 'DIFF=`git diff --name-only --diff-filter=U`'
    - 'if [ "$DIFF" == "" ]'
    - 'then git push'
    - 'else curl --request POST --header "PRIVATE-TOKEN: $PRIVATEAPIKEY" https://collaborating.tuhh.de/api/v4/projects/tusp%2Ftusp/issues?title=Sync%20master%20to%20staging%20faild&description=please%20merge%20manuel'
    - 'fi'
  only:
    - master
  when: delayed
  start_in: 5 minutes
