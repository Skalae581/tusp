variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "-T 1C --batch-mode"
  # --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true

stages:
  - test
  - deploy
  - sync
  - report

# Geplanter Build-Prozess
# 
# Auf jedem Feature-Branch:
# 1. Run Unit-Tests  (job unit-test)
# 2. Mergerequest stellen und (wenn alles gut ist) mergen auf master oder staging
# 3. Jacoco und Ceckstyle Report (job report nur manuell)
#
# Auf Staging-Branch:
# 1. Run all Tests (job verify)
# 2. Deploy auf tst und tst2 (job deploy-tst und deploy-tst2)
# 3. Jacoco und Ceckstyle Report (job report2)
#
# Auf Master-Branch
# 1. Run all Tests (job verify)
# 2. Deploy auf dev (job deploy-dev)
# 2b. Deploy auf Prod (job deploy-prod nur manuell)
# 3. Merge master -> staging (job sync)
# 4. Vollständiges Reporting (job report2, javadoc)

###### test stage ######
unit-test:
  stage: test
  script:
    - 'mvn $MAVEN_CLI_OPTS test -f pom.xml -Dgitlab=true'
  image: maven:3.6.3-jdk-11
  except: 
    - master
    - 329-hio-update-auf-2021-06
    - staging
  artifacts:
    paths:
    - target/surefire-reports/*.txt
    - target/jacoco.exec
    - target/classes
    expire_in: 1 day
    when: always
    
verify:
  stage: test
  script:
    - echo $CI_PIPELINE_ID "("`date`")" > src/main/resources/version.txt
    - 'mvn $MAVEN_CLI_OPTS verify -Dgitlab=true'
  image: maven:3.6.3-jdk-11
  only: 
   - master
   - 329-hio-update-auf-2021-06
   - staging
  artifacts:
    paths:
    - target/surefire-reports/*.txt
    - target/jacoco.exec
    - target/jacoco-it.exec
    - target/tusp.war
    - target/classes
    expire_in: 1 week
    when: always
  

