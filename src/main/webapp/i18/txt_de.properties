de.tuhh.tusp.stu.sptim.portalmessage.subject=Benachrichtigung über TUHH Account
de.tuhh.tusp.stu.sptim.portalmessage.body=ab sofort steht Ihnen in Ihrem TUNE-Portal Ihr TU-Account inklusive einer TUHH-Mail-Adresse zur Verfügung. Wie Sie diesen Einrichten erfahren Sie unter https://www.tuhh.de/t3resources/tuhh/download/studium/studierende/InfoTU-Account012020.pdf Sie sind zum regelmäßigen Abrufen dieser Mailadresse verpflichtet. Die TUHH kommuniziert nur über diese Mailadresse mit Ihnen. Den Account benötigen Sie um sich Immatrikulationsbescheinigungen und Bescheinigungen für das BAfög-Amt auszudrucken und alle weiteren Selbstbedienungsfunktionen (Ab- und Anmelden von Prüfungen, StudIP usw.) zu nutzen. Nachdem Sie den Account eingerichtet haben, können Sie sich als Studierende auf https://tune.tuhh.de/ einloggen. Sofern Sie Schwierigkeiten bei der Einrichtung des Accounts haben, wenden Sie sich bitte an servicedesk@tuhh.de      


