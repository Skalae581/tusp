de.tuhh.tusp.stu.sptim.portalmessage.subject=Information about TUHH account
de.tuhh.tusp.stu.sptim.portalmessage.body=from now on you can find your TU account and your TU-email-address in the TUNE-portal.To get to know how to acticate your TU account please check: https://www.tuhh.de/t3resources/tuhh/download/studium/studierende/InfoTU-Account012020eng.pdf You are obligated to check for emails from your TUHH account on a regular basis. The TUHH only communicates to you via this email address.You  need your TU account to print certificates of enrolment and certificates for the BAföG office and to access all the  other self service functions (registration and deregistration for examinations Stud.IP etc.). After you have activated your account you can login as student on https://tune.tuhh.de/ If you have  problems to activate  TUHH account, please  contact servicedesk@tuhh.de   



