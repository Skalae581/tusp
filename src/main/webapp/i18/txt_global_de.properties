global.identity.get=Mit PuttyGen kann ein Key wie folgt erzeugt werden: <ol><li>SSH2-RSA Key erstellen und den tusp.transfer.hash als Passwort festlegen</li><li>Public-Key speichern</li><li>mit "Cenversions" -> "Export OpenSSH key" den Private-Key speichern</li><li>Public-Key auf allen Servern in ~/.ssh/authorized_keys schreiben (Achtung: Key darf keine Zeilenumbrüche enthalten, muss starten mit "ssh-rsa " und darf mit einem Kommentar enden.)</li></ol>
global.knownhost.get=Ein Host-Key kann gesucht werden mit dem folgenden Linux-Befehl: <em>ssh-keyscan.exe &lt;hostname&gt; | grep ecdsa-sha2-nistp256</em>. In der erscheinenden Zeile ist alles ab dem AAA zu kopieren.
