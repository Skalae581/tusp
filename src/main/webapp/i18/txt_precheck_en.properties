precheck.subject =  pre-check: Result for:
precheck.body.code = Code: 

precheck.body.pendant =  <br>On the basis of the data you have submitted we are not yet able to decide whether you stand a reasonable chance of gaining admission to study in the Master's program of your choice. We need to check your qualifications in greater detail. If you are still interested in studying at the TUHH please apply so that we can gain a clearer idea of your previous studies and qualifications on the basis of your full and detailed application documents. Please note that we can only make a final admission decision on the basis of your application documents, assuming that they have been submitted in full as required and within the application period.<br><br> At first please check the subject specific requirements at<br><a href="https://www.tuhh.de/alt/tuhh/education/degree-courses/international-study-programs/how-and-when-to-apply/specific-requirements.html" target="_blank" rel="external">https://www.tuhh.de/alt/tuhh/education/degree-courses/international-study-programs/how-and-when-to-apply/specific-requirements.html</a>.<br><br> If your Bachelor\u2019s program meets the subject specific requirements we would like to ask you to submit an application for admission. Please note that we can only make a final admission decision on the basis of your application documents, assuming that they have been submitted in full as required and within the application period (December 1, 2021 \u2013 March 1, 2022). To start your application you may click on the online application link and follow the instructions: <br> <a href="https://tune.tuhh.de/">https://tune.tuhh.de/</a><br><br>Below you will find the code which you will need during the online application procedure in order to verify your assessment test result. It is not possible to complete the application process without this code. Note: This code is personal and can only be used once.
precheck.body.pendant.rest = The online application facility will be enabled on December 1, 2021 and deactivated on March 1, 2022. Please note that incomplete applications or applications submitted by fax or e-mail cannot be considered.<br><br>Kind regards,<br>The STUDIS Team 
precheck.body.accepted = <br>We are pleased to hear that you are interested in studying at the TUHH and would like to ask you to submit an application for admission to study the Master's program of your choice. At first please check the subject specific requirements at <br><a href="https://www.tuhh.de/alt/tuhh/education/degree-courses/international-study-programs/how-and-when-to-apply/specific-requirements.html" target="_blank" rel="external">https://www.tuhh.de/alt/tuhh/education/degree-courses/international-study-programs/how-and-when-to-apply/specific-requirements.html</a>.<br><br>If your Bachelor\u2019s program meets the subject specific requirements we would like to ask you to submit an application for admission. Please note that we can only make a final admission decision on the basis of your application documents, assuming that they have been submitted in full as required and within the application period (December 1, 2021 \u2013 March 1, 2022). To start your application you may click on the online application link and follow the instructions: <br> <a href="https://tune.tuhh.de/">https://tune.tuhh.de/</a><br><br>Below you will find the code which you will need during the online application procedure in order to verify your assessment test result. It is not possible to complete the application process without this code. Note: This code is personal and can only be used once.
precheck.body.accepted.rest = The online application facility will be enabled on December 1, 2021 and deactivated on March 1, 2022. Please note that incomplete applications or applications submitted by fax or e-mail cannot be considered.<br><br>Kind regards,<br>The STUDIS Team
precheck.body.dec1 = <br>Thank you for your expression of interest in studying at the Hamburg University of Technology (TUHH). The requirements for admission to the international Master\u2019s degree programs are very strict. On the basis of your online preliminary assessment details we regret to say that if you were to apply you would not gain admission to study because the average grade of your Bachelor's degree does not meet the very strict admission requirements for the Master's program which you are interested in.<br><br>We are very sorry that we cannot give you a positive reply.<br><br>Kind regards,<br>The STUDIS Team<br><br>
precheck.body.dec2 = <br>Thank you for your expression of interest in studying at the Hamburg University of Technology (TUHH). The requirements for admission to the international Master\u2019s degree programs are very strict. On the basis of your online preliminary assessment details we regret to say that if you were to apply you would not gain admission to study because your Bachelor's degree does not match the Master's program which you are interested in. We are very sorry that we cannot give you a positive reply. <br><br>Kind regards,<br>The STUDIS Team<br><br>				
precheck.body.dec3 = <br>Thank you for your expression of interest in studying at the Hamburg University of Technology (TUHH). The requirements for admission to the international Master\u2019s degree programs are very strict. On the basis of your online preliminary assessment details we regret to say that if you were to apply you would not gain admission to study because at least two of the following named requirements will not be fulfilled:<br><br>\u2022the average grade of your Bachelor's degree does not meet the very strict admission requirements for the Master's program and/or<br>\u2022your Bachelor's degree does not match the Master's program which you are interested in and/or<br>\u2022your educational institution you are attending is not a recognized type of university. We are very sorry that we cannot give you a positive reply.<br><br>Kind regards,<br>The STUDIS Team<br><br>
precheck.body.sonderfallTIE = Thank you very much for your interest in our international Joint-Master-Program "Global Technology and Innovation Management & Entrepreneurship" (G-TIME). For detailed information regarding program content, its structure, the global pratner network, tuition fees etc. please visit our website https://www.tuhh.de/alt/tuhh/education/degree-courses/international-study-programs/global-technology-and-innovation-management-entrepreneurship.html. In addition, please do not hesitate to contact Dr Stephan Buse (stephan.buse@tuhh.de) before starting the online application. As the program coordinator he would be pleased to provide all information needed. To start the online application please click on the online application link and follow the instructions: Yours truly, G-TIME International Partner Consortium and the STUDIS Team of TUHH Please do not reply to this e-mail address. Your e-mail will be deleted automatically! https://tune.tuhh.de/ (Please use a different web browser if the link does not work.) The online application facility will be enabled on January 1, 2019 (probably) and deactivated on March 1, 2019. Please note that incomplete applications, applications submitted by fax or e-mail and belated applications cannot be considered.					
											
precheck.body.empf_bestaetigung = <p>Dear madam/sir,</p><p>Thank you for transfering your pre-check information.</p><p>As we are receiving many pre-checks and applications at the moment, it will take several days until you will get the result.</p><p>We kindly ask you to refrain from sending messages in between, as these mails will cause delay for the whole process.</p><br /><p>Best regards <br />The STUDIS-Team</p>
precheck.subject.empf_bestaetigung = pre-check: confirmation of receipt
precheck.empf_bestaetigung_fail = Sending the receipt mail faild.
							
					
					
					
							
					
					
					
					
					
					
					

