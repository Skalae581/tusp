#Info Vorab-Check  
vorabcheck.info_vorabcheck.titel =  Vorab-Check zur fachlichen Eignung für die deutschsprachigen Master-Studiengänge der TUHH 
vorabcheck.info_vorabcheck.titel1 = Wozu dient der Vorab-Check?
vorabcheck.info_vorabcheck.einl1 = Neben dem erfolgreichen Abschluss eines Studiums in einem grundständigen Studiengang werden gemäß $ 2 Absatz 1 Nr. 2 der Satzung über das Studium in der geltenden Fassung für den Zugang zum Studium im Master-Studiengang "<b>{0}</b>" fachspezifische Kenntnisse und Kompetenzen vorausgesetzt. <br><br> Mit Hilfe des Vorab-Checks können Sie auch außerhalb des Bewerbungsverfahrens für sich ganz individuell und unverbindlich überprüfen, ob für Sie eine Bewerbung um ein Masterstudium im Masterstudiengang "<b>{0}</b>" sinnvoll ist oder nicht. <br><br>Nach Absenden des Formulars erhalten Sie eine automatisierte Rückantwort, die Ihnen eine Einschätzung Ihrer fachlichen Eignung anhand der von Ihnen erbrachten Eintragungen vermittelt.
vorabcheck.info_vorabcheck.titel2 = Was müssen Sie dafür tun?
vorabcheck.info_vorabcheck.einl2 = Auf der folgenden Seite finden Sie ein Formular, auf dem die fachspezifischen Kenntnisse und Kompetenzen für den Masterstudiengang "<b>{0}</b>" mitsamt der jeweils erforderlichen ECTS-Anzahl aufgelistet sind. <br><br>Ordnen Sie in das Formular die von Ihnen erworbenen Kenntnisse und Kompetenzen wahrheitsgemäß den Anforderungen an der TUHH zu und geben Sie jeweils die dazugehörige ECTS-Anzahl Ihres grundständigen Studiums an. <br><br>Bitte beachten Sie, dass fachspezifische Kenntnisse aus verschiedenen Anforderungsbereichen, die innerhalb eines Moduls erworben wurden, gesplittet und nicht doppelt angegeben werden müssen.
vorabcheck.info_vorabcheck.einl3 = Sollten Sie in einem Diplom-Studiengang oder einem anderen Studiengang, in dem keine ECTS-Leistungspunkte erteilt wurden, studiert haben, ist der Vorab-Check hier leider nicht möglich. Trotzdem ist es in diesen Fällen sicherlich hilfreich, sich mit den geforderten fachspezifischen Kenntnissen für diesen Masterstudiengang zu beschäftigen und auch abseits dieses Vorab-Checks zu überprüfen, ob Sie die aufgelisteten Anforderungen in Inhalt und Umfang während Ihres Studiums erworben haben. Klicken Sie sich bitte dennoch durch den Vorab-Check, um zur Bewerbung zu gelangen. <br><br>Da der Vorab-Check ausschließlich auf Ihren eigenen Angaben basiert, weisen wir noch einmal ausdrücklich darauf hin, dass hiermit keine inhaltliche überprüfung Ihrer fachlichen Eignung für den gewünschten deutschsprachigen Masterstudiengang erfolgt. Dies geschieht erst im Rahmen der Online-Bewerbung durch die jeweils zuständigen Fachbereiche. <br><br>Anders als hier müssen Sie im Rahmen des Online-Bewerbungsverfahrens auch alle Angaben zu Ihren Kenntnissen und Kompetenzen durch aussagekräftige Unterlagen belegen. In der Regel sind dies das Transcript of Records und das Modulhandbuch Ihres grundständigen Studienganges. Sollte für Sie also nach Abschluss des Vorab-Checks eine Bewerbung an der TUHH in Frage kommen, so stellen Sie bitte sicher, dass Sie diese Unterlagen auch parat haben, um Sie rechtzeitig im Zuge der Bewerbung einreichen zu können. Ist die Online-Bewerbung nämlich erst einmal abgeschlossen, können keine Unterlagen mehr nachgereicht werden.
vorabcheck.info_vorabcheck.entweder = Entweder:<br><br>Sofern Sie es wünschen, können Sie die Eintragungen im Vorab-Check für die spätere Online-Bewerbung weiter verwenden. Die Aktivierung erfolgt über eine Code-Nummer, die Ihnen nach Abschluss des Vorab-Checks zugesandt wird. Nach Ablauf der Bewerbungsfrist verfällt die Code-Nummer und die in diesem Vorab-Check gemachten Angaben werden gelöscht.
vorabcheck.info_vorabcheck.oder = Oder:<br><br>Der von Ihnen durchgeführte Vorab-Check dient ausschließlich Ihrer Selbsteinschätzung. Das Ergebnis wird weder gespeichert noch in sonstiger Weise mit einer möglichen späteren Bewerbung Ihrerseits verknüpft. 
vorabcheck.info_vorabcheck.schlusswort = Nun wünschen wir Ihnen viel Erfolg beim Durchführen des Vorab-Checks für den deutschsprachigen Masterstudiengang "<b>{0}</b>" an der TUHH!

#ECTS
vorabcheck.ects_vorabcheck.title = Vorab-Check: 
vorabcheck.ects_vorabcheck.hinweisTitel = Hinweise zum Ausfüllen:
vorabcheck.ects_vorabcheck.hinweis1 = Bitte geben Sie in der Spalte "Im Vorstudium erbrachte ECTS" die von Ihnen absolvierten ECTS in dem jeweiligen Themenbereich an. Bitte füllen Sie die grau hinterlegten Felder aus. Das System überträgt die Summen automatisch in die gelb hinterlegten Felder.
vorabcheck.ects_vorabcheck.hinweis2 = Überprüfen Sie Ihre Angaben erneut und betätigen Sie dann den Senden-Button unterhalb der Tabelle. Nach dem Absenden der Daten erhalten Sie eine Kurzauswertung (bei Zustimmung und Angabe der E-Mail-Adresse auch per E-Mail) und weitere Informationen zum Bewerbungsverfahren.
vorabcheck.ects_vorabcheck.fehler = Bitte nur Zahlen eingeben!
vorabcheck.ects_vorabcheck.fehlerDec = Erlaubt sind nur die Nachkommastellen 0.5 und 0.75!
vorabcheck.ects_vorabcheck.fehlerNeg = Bitte nur positive Zahlen eingeben!
