#General
vorabcheck.menu = Vorab-Check
vorabcheck.perform = Vorab-Check durchführen
vorabcheck.datenspeichern = Die Angaben, die Sie auf den nachfolgenden Seiten machen, werden in erweiterter Form fällig, wenn zu einem späteren Zeitpunkt die Bewerbung zu einem deutschsprachigen Masterstudium durchgeführt wird. Daher haben Sie hier die Wahl, diese Angaben (E-Mail-Adresse, Studiengang sowie ECTS) für die Dauer des Bewerbungszeitraums zu speichern. So sparen Sie sich eventuelle Doppelarbeit. Wenn Sie einer Speicherung zustimmen, setzen Sie hier bitte ein Häkchen.

#Start Vorab-Check
vorabcheck.start = Herzlich Willkommen bei der Online-Bewerbung der TUHH!
vorabcheck.einleitung = Bevor die eigentliche Bewerbungsmaske der TUHH gestartet wird, möchten wir Sie einladen, unverbindlich einen kleinen Vorab-Check zur fachlichen Eignung durchzuführen. Bitte machen Sie die entsprechenden Angaben auf den Folgeseiten. Am Ende des Vorab-Checks erhalten Sie eine Kurzauswertung und den Zugang zur Online-Bewerbung, sofern das Bewerbungsverfahren derzeit geöffnet ist. Exakte Informationen dazu finden Sie auf www.tuhh.de. Bitte beachten Sie auch: Sie können den Vorab-Check zu jeder Zeit und für jeden der deutschsprachigen Masterstudiengänge durchführen, unabhängig davon, ob eine Bewerbung für dieses Programm zum kommenden Semester möglich ist.
