vorabcheck.start.codeNummer = Codenummer
vervollst.partOneOfInfo = Neben dem erfolgreichen Abschluss eines Studiums in einem grundständigen Studiengang werden gemäß § 2 Absatz 1 Nr. 2 der Satzung über das Studium in der geltenden Fassung für den Zugang zum Studium im oben angegebenen Studiengang fachspezifische Kenntnisse und Kompetenzen in den unten beschriebenen Fachgebieten vorausgesetzt.<br><br>Die Überprüfung Ihrer Vorkenntnisse erfolgt anhand der beigefügten Unterlagen. In der Regel sind dies das Transcript of Records und das Modulhandbuch Ihres grundständigen Studienganges.<br><br>Bitte ordnen Sie in die unten stehende Tabelle die von Ihnen erworbenen Kenntnisse und Kompetenzen wahrheitsgemäß den Anforderungen an der TUHH zu und geben die ECTS-Anzahl Ihres grundständigen Studiums an. Bitte beachten Sie, dass fachspezifische Kenntnisse aus verschiedenen Anforderungsbereichen, die innerhalb eines Moduls erworben wurden, gesplittet und nicht doppelt angegeben werden müssen.
vervollst.partTwoOfInfo =  Sollten Sie in einem Diplom-Studiengang oder einem anderen Studiengang, in dem keine ECTS-Leistungspunkte erteilt wurden, studiert haben, tragen Sie bitte in der Spalte "Kenntniserwerb ohne Erhalt von ECTS" die Semesterwochenstunden (SWS) ein, und fügen Sie entsprechende Nachweise bei.<br><br>Ihre Angaben in der unten stehenden Tabelle werden durch die TUHH geprüft, bitte stellen Sie daher sicher, dass Sie alle relevanten Unterlagen hochgeladen haben.
vervollst.partThreeOfInfo = <b>Bitte beachten Sie:</b><br><br>Die Nachweispflicht (ECTS und / oder auf sonstige Weise) liegt bei Ihnen. Sie müssen alle Unterlagen vollständig einreichen, aus denen sich der Nachweis ergibt oder ergeben kann. Die Nachreichung von Unterlagen ist nicht möglich.
vervollst.partFourOfInfo = Hinweise zum Ausfüllen:
vervollst.partFourOfInfo.firstNote = Bitte geben Sie in der Spalte "Im Vorstudium erbrachte ECTS" die von Ihnen absolvierten ECTS in dem jeweiligen Themenbereich an.
vervollst.partFourOfInfo.secondNote = Bitte geben Sie in der Spalte "Kenntniserwerb ohne Erhalt von ECTS" die SWS ein, sollte dies bei Ihnen (ggf. zusätzlich zum ECTS-Erwerb) zutreffen.
vervollst.partFourOfInfo.thirdNote = Bitte geben Sie in der Spalte "Vergleiche Angaben im angefügten Modulhandbuch Seite" die Seitenzahl im Modulhandbuch an, auf der sich entsprechende Angaben finden. Bitte geben Sie nur die Seitenzahl an.
vervollst.partFourOfInfo.fourthNote = Bitte geben Sie in der Spalte "Vergleiche sonstigen beigefügten Nachweis (Seite)" an, um welchen Nachweis es sich handelt, Ausstellungsdatum und ggf. die Seitenzahl, auf der sich im jeweiligen Dokument die Angaben befinden.
vervollst.partFourOfInfo.fifthNote = Sofern Sie weitere Angabe zu den Eintragungen machen möchten oder zusätzliche Informationen geben können, die für die Beurteilung Ihrer Vorbildung hilfreich sein können, nutzen Sie bitte den Freiraum im Anschluss an die Tabelle.
vervollst.partFourOfInfo.sixthNote = Für interne Bewerberinnen und Bewerber (Absolventinnen und Absolventen eines TUHH-Bachelorprogramms) gilt zusätzlich: Bitte machen Sie unbedingt Angaben in dem Feld "Zusätzlich erforderliche Leistungspunkte im Bereich BWL/Ökonomie für interne Bewerbungen" unterhalb der nachstehenden Tabellen.
vervollst.annotation = Freiraum für Anmerkungen bzw. Ergänzungen der Bewerberin bzw. des Bewerbers
vervollst.lectures = Mögliche Lehrveranstaltungen
vervollst.erbracht = Habe ich bereits erbracht (Name der Lehrveranstaltung sowie Datum des Zeitpunkts der Erbringung (muss in Leistungsübersicht enthalten sein))
vervollst.ausstehend = Werde ich bis zur Umschreibung in das Masterprogramm erbringen (Name der Lehrveranstaltung und geplantes Datum der Leistungserbringung)*
vorabcheck.vervollst.stern = * Eine Zulassung ist in diesem Fall nur unter Bedingungen möglich, ohne dass es einer Angabe dieser Bedingungen im Zulassungsbescheid bedarf.
vorabcheck.vervollst.codeHinweis = Leider wurden zur angegebenen Codenummer keine Daten gefunden. Bitte wählen Sie stattdessen unten den gewünschten Studiengang und füllen den ECTS-Bogen im nächsten Schritt aus. Alternativ können Sie sich auch mit uns in Verbindung setzen, wenn Sie sicher sind, dass der zugesandte Link mit der Codenummer gültig ist. Geben Sie außerdem bitte die Codenummer bzw. den Link an.
vorabcheck.vervollst.stgHinweis = Leider ist es zur Zeit nicht möglich, für diesen Studiengang eine Bewerbung einzureichen. Bitte wählen Sie alternativ unten einen anderen Studiengang und füllen den ECTS-Bogen im nächsten Schritt aus. Alternativ können Sie sich auch mit uns in Verbindung setzen, wenn Sie sicher sind, dass es sich dabei um einen Irrtum handelt. Geben Sie außerdem bitte die Codenummer bzw. den Link an.

