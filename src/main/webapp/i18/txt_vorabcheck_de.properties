#ECTS-Auswahl
vorabcheck.ects.null = Für den von Ihnen gewählten Studiengang ist die selbstständige Überprüfung der fachlichen Eignung leider nicht möglich.<br><br> Das Anforderungsprofil können Sie unter <a href="http://www.tuhh.de/tuhh/studium/bewerbung/masterstudiengaenge-deutschsprachig/anforderungen-fuer-die-master-studiengaenge.html" target="_blank" rel="external">http://www.tuhh.de/tuhh/studium/bewerbung/masterstudiengaenge-deutschsprachig/anforderungen-fuer-die-master-studiengaenge.html</a> nachlesen.<br><br> Sofern Sie nach eigener Einschätzung die Kriterien erfüllen, laden wir Sie herzlich ein, sich an der TUHH zu bewerben. Zur Online-Bewerbung gelangen Sie <a href="http://www.tuhh.de/bewerben" target="_blank" rel="external">hier</a>. Bitte beachten Sie die Bewerbungsfristen.

#Result
vorabcheck.result_vorabcheck.titel =  Ergebnis zum Vorab-Check
vorabcheck.result_vorabcheck.textVorher = Liebe/r Studieninteressierte/r, <br><br>der Vorab-Check zur fachlichen Eignung für die deutschsprachigen Master-Studiengänge der TUHH hat ergeben, dass die für eine erfolgreiche Bewerbung notwendigen fachspezifischen Kenntnisse und Kompetenzen für den gewählten Master-Studiengang an der TUHH gemäß Ihrer eigenen Angaben 
vorabcheck.result_vorabcheck.textGruen = <strong>überwiegend vorliegen</strong>. <br><br>Wir laden Sie daher ein, die Online-Bewerbung durchzuführen. Bitte beachten Sie,
vorabcheck.result_vorabcheck.textOrange = <strong>nur in Teilen vorliegen</strong>. <br><br>Die inhaltliche Überprüfung kann erst im Rahmen der Online-Bewerbung erfolgen. Bitte beachten Sie,
vorabcheck.result_vorabcheck.textRot = <strong>deutliche Lücken aufweisen</strong>. <br><br><strong>Sie müssen daher im Falle einer Bewerbung mit einem negativen Ergebnis rechnen.</strong><br><br>Sollten Sie sich dennoch zu einer Bewerbung entschließen, beachten Sie bitte,
vorabcheck.result_vorabcheck.textNachher =  dass Sie dann alle Angaben zu Ihren Kenntnissen und Kompetenzen durch aussagekräftige Unterlagen belegen m&uuml;ssen. In der Regel sind dies das Transcript of Records und das Modulhandbuch Ihres grundständigen Studienganges. Stellen Sie bitte sicher, dass Sie diese Unterlagen parat haben, um sie rechtzeitig im Zuge der Bewerbung einreichen zu können. <br><br>Bitte beachten Sie auch Folgendes: Sofern Sie Ihr Studium im Moment noch nicht abgeschlossen haben, müssen Sie mit der Bewerbung eine Prognosebescheinigung einreichen. Aus der Bescheinigung muss eindeutig ersichtlich sein, dass das Studium vor Beginn des Masterstudiums an der TUHH beendet sein wird (für ein Sommersemester bis 31. März d. J. / für ein Wintersemester bis 30. September d. J.). Ein Muster finden Sie <a href="http://www.tuhh.de/t3resources/tuhh/download/studium/studieninteressierte/Prognoseab131.pdf" target="_blank" rel="external">hier</a>.
vorabcheck.result_vorabcheck.textAbschluss = Hier gelangen Sie jetzt direkt zur <a href="http://www.tuhh.de/bewerben" target="_blank" rel="external">Online-Bewerbung</a>. Sollten Sie die Bewerbung jetzt nicht direkt starten wollen und Ihre E-Mail-Adresse im ersten Schritt angegeben haben, so nutzen Sie bitte zu einem späteren Zeitpunkt den Link, den wir Ihnen mit separater Mail zugesandt haben.
vorabcheck.result_vorabcheck.mailBetreff = Vorabinfo zu Anforderungen
vorabcheck.result_vorabcheck.mailUrlCodeAlt = <br><br>Zur Online-Bewerbung gelangen Sie <a href="http://www.tuhh.de/bewerben" target="_blank" rel="external">hier</a>. Die Code-Nummer für eine weitere Verwendung Ihrer Eintragungen während der Online-Bewerbung lautet:
vorabcheck.result_vorabcheck.mailUrlCode = <br><br>Den für die Bewerbung notwendigen ECTS-Bogen können Sie <a href="{0}/tusp/bewVervollst/codelink?bewhash={1}" target="_blank" rel="external">hier</a> erstellen und herunterladen. <br><br> Zur Online-Bewerbung gelangen Sie hier: <a href="http://www.tuhh.de/bewerben" target="_blank" rel="external">http://www.tuhh.de/bewerben</a>
